<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>서울 날씨</title>
  <style>
    :root {
      --bg: #eef3f9;
      --card: #ffffff;
      --text: #1d2733;
      --muted: #66758a;
      --accent: #2f6fde;
      --border: #dbe3ee;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #11161d;
        --card: #1a212b;
        --text: #e6edf5;
        --muted: #92a0b3;
        --accent: #6aa0ff;
        --border: #2a3441;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Malgun Gothic", system-ui, sans-serif;
      background: var(--bg);
      color: var(--text);
      padding: 24px 16px;
    }
    main { max-width: 760px; margin: 0 auto; }
    header { display: flex; justify-content: space-between; align-items: center; gap: 12px; flex-wrap: wrap; }
    h1 { margin: 0; font-size: 1.6rem; }
    button {
      background: var(--accent); color: #fff; border: 0; border-radius: 8px;
      padding: 8px 14px; font-size: 0.95rem; cursor: pointer;
    }
    button:disabled { opacity: 0.6; cursor: default; }
    .card {
      background: var(--card); border: 1px solid var(--border); border-radius: 14px;
      padding: 20px; margin-top: 16px;
    }
    .current { display: flex; align-items: center; gap: 20px; flex-wrap: wrap; }
    .icon { font-size: 4rem; line-height: 1; }
    .temp { font-size: 3rem; font-weight: 700; }
    .desc { font-size: 1.1rem; color: var(--muted); }
    .grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(140px, 1fr)); gap: 12px; margin-top: 16px; }
    .stat { border: 1px solid var(--border); border-radius: 10px; padding: 10px 12px; }
    .stat .label { font-size: 0.8rem; color: var(--muted); }
    .stat .value { font-size: 1.15rem; font-weight: 600; margin-top: 2px; }
    h2 { font-size: 1.1rem; margin: 0 0 12px; }
    .hourly { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 6px; }
    .hour { flex: 0 0 72px; text-align: center; border: 1px solid var(--border); border-radius: 10px; padding: 8px 4px; }
    .hour .t { font-weight: 600; }
    .small { font-size: 0.8rem; color: var(--muted); }
    .daily-row {
      display: grid; grid-template-columns: 90px 40px 1fr auto; align-items: center;
      gap: 10px; padding: 8px 0; border-bottom: 1px solid var(--border);
    }
    .daily-row:last-child { border-bottom: 0; }
    .error { color: #d64545; }
    footer { margin-top: 16px; text-align: center; font-size: 0.8rem; color: var(--muted); }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <main>
    <header>
      <div>
        <h1>서울, 대한민국 날씨</h1>
        <div class="small" id="updated">불러오는 중…</div>
      </div>
      <button id="refresh">새로고침</button>
    </header>

    <section class="card" id="current-card">
      <div id="current">날씨 정보를 불러오는 중입니다…</div>
    </section>

    <section class="card">
      <h2>시간별 예보 (24시간)</h2>
      <div class="hourly" id="hourly"></div>
    </section>

    <section class="card">
      <h2>7일 예보</h2>
      <div id="daily"></div>
    </section>

    <footer>
      데이터 제공: <a href="https://open-meteo.com/" target="_blank" rel="noopener">Open-Meteo.com</a> (API 키 불필요)
    </footer>
  </main>

  <script>
    // 서울 좌표
    const LAT = 37.5665;
    const LON = 126.978;

    const API_URL =
      "https://api.open-meteo.com/v1/forecast" +
      `?latitude=${LAT}&longitude=${LON}` +
      "&current=temperature_2m,relative_humidity_2m,apparent_temperature,precipitation,weather_code,wind_speed_10m,wind_direction_10m,is_day" +
      "&hourly=temperature_2m,weather_code,precipitation_probability" +
      "&daily=weather_code,temperature_2m_max,temperature_2m_min,precipitation_probability_max,sunrise,sunset" +
      "&timezone=Asia%2FSeoul&forecast_days=7";

    // WMO 날씨 코드 → [설명, 낮 아이콘, 밤 아이콘]
    const WMO = {
      0: ["맑음", "☀️", "🌙"],
      1: ["대체로 맑음", "🌤️", "🌙"],
      2: ["구름 조금", "⛅", "☁️"],
      3: ["흐림", "☁️", "☁️"],
      45: ["안개", "🌫️", "🌫️"],
      48: ["짙은 안개", "🌫️", "🌫️"],
      51: ["약한 이슬비", "🌦️", "🌧️"],
      53: ["이슬비", "🌦️", "🌧️"],
      55: ["강한 이슬비", "🌧️", "🌧️"],
      56: ["약한 어는 이슬비", "🌧️", "🌧️"],
      57: ["강한 어는 이슬비", "🌧️", "🌧️"],
      61: ["약한 비", "🌦️", "🌧️"],
      63: ["비", "🌧️", "🌧️"],
      65: ["강한 비", "🌧️", "🌧️"],
      66: ["약한 어는 비", "🌧️", "🌧️"],
      67: ["강한 어는 비", "🌧️", "🌧️"],
      71: ["약한 눈", "🌨️", "🌨️"],
      73: ["눈", "🌨️", "🌨️"],
      75: ["강한 눈", "❄️", "❄️"],
      77: ["싸락눈", "🌨️", "🌨️"],
      80: ["약한 소나기", "🌦️", "🌧️"],
      81: ["소나기", "🌧️", "🌧️"],
      82: ["강한 소나기", "⛈️", "⛈️"],
      85: ["약한 눈 소나기", "🌨️", "🌨️"],
      86: ["강한 눈 소나기", "❄️", "❄️"],
      95: ["뇌우", "⛈️", "⛈️"],
      96: ["우박 동반 뇌우", "⛈️", "⛈️"],
      99: ["강한 우박 동반 뇌우", "⛈️", "⛈️"],
    };

    function describe(code, isDay = 1) {
      const [text, day, night] = WMO[code] || ["알 수 없음", "❔", "❔"];
      return { text, icon: isDay ? day : night };
    }

    function windDirection(deg) {
      const dirs = ["북", "북동", "동", "남동", "남", "남서", "서", "북서"];
      return dirs[Math.round(deg / 45) % 8];
    }

    const $ = (id) => document.getElementById(id);

    function renderCurrent(c, daily) {
      const { text, icon } = describe(c.weather_code, c.is_day);
      $("current").innerHTML = `
        <div class="current">
          <div class="icon">${icon}</div>
          <div>
            <div class="temp">${Math.round(c.temperature_2m)}°C</div>
            <div class="desc">${text} · 체감 ${Math.round(c.apparent_temperature)}°C</div>
          </div>
        </div>
        <div class="grid">
          <div class="stat"><div class="label">최고 / 최저</div>
            <div class="value">${Math.round(daily.temperature_2m_max[0])}° / ${Math.round(daily.temperature_2m_min[0])}°</div></div>
          <div class="stat"><div class="label">습도</div><div class="value">${c.relative_humidity_2m}%</div></div>
          <div class="stat"><div class="label">바람</div>
            <div class="value">${windDirection(c.wind_direction_10m)} ${c.wind_speed_10m} km/h</div></div>
          <div class="stat"><div class="label">강수량</div><div class="value">${c.precipitation} mm</div></div>
          <div class="stat"><div class="label">일출</div><div class="value">${daily.sunrise[0].slice(11)}</div></div>
          <div class="stat"><div class="label">일몰</div><div class="value">${daily.sunset[0].slice(11)}</div></div>
        </div>`;
    }

    function renderHourly(h, currentTime) {
      // 현재 시각 이후 24시간
      const start = Math.max(0, h.time.findIndex((t) => t >= currentTime.slice(0, 13)));
      let html = "";
      for (let i = start; i < start + 24 && i < h.time.length; i++) {
        const hour = Number(h.time[i].slice(11, 13));
        const { icon } = describe(h.weather_code[i], hour >= 6 && hour < 19 ? 1 : 0);
        html += `
          <div class="hour">
            <div class="small">${hour}시</div>
            <div style="font-size:1.5rem">${icon}</div>
            <div class="t">${Math.round(h.temperature_2m[i])}°</div>
            <div class="small">💧${h.precipitation_probability[i] ?? 0}%</div>
          </div>`;
      }
      $("hourly").innerHTML = html;
    }

    function renderDaily(d) {
      const days = ["일", "월", "화", "수", "목", "금", "토"];
      $("daily").innerHTML = d.time
        .map((date, i) => {
          const dt = new Date(date + "T00:00:00");
          const label = i === 0 ? "오늘" : `${dt.getMonth() + 1}/${dt.getDate()} (${days[dt.getDay()]})`;
          const { text, icon } = describe(d.weather_code[i]);
          return `
            <div class="daily-row">
              <div>${label}</div>
              <div style="font-size:1.4rem">${icon}</div>
              <div class="small">${text} · 💧${d.precipitation_probability_max[i] ?? 0}%</div>
              <div><strong>${Math.round(d.temperature_2m_max[i])}°</strong>
                <span class="small"> / ${Math.round(d.temperature_2m_min[i])}°</span></div>
            </div>`;
        })
        .join("");
    }

    async function loadWeather() {
      const btn = $("refresh");
      btn.disabled = true;
      $("updated").textContent = "불러오는 중…";
      try {
        const res = await fetch(API_URL);
        if (!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        renderCurrent(data.current, data.daily);
        renderHourly(data.hourly, data.current.time);
        renderDaily(data.daily);
        $("updated").textContent = `기준 시각: ${data.current.time.replace("T", " ")} (KST)`;
      } catch (err) {
        $("current").innerHTML = `<p class="error">날씨 정보를 가져오지 못했습니다: ${err.message}</p>`;
        $("updated").textContent = "오류 발생";
      } finally {
        btn.disabled = false;
      }
    }

    $("refresh").addEventListener("click", loadWeather);
    loadWeather();
  </script>
</body>
</html>
